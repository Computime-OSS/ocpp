name: SonarQube Cloud PR Analysis

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  sonar-pr:
    # Only run for PRs whose source branch is dev and target branch is main
    if: github.head_ref == 'dev' && github.base_ref == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run tests and generate coverage.xml
        run: |
          pytest \
            --cov=custom_components/ocpp \
            --cov-report=xml:coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Computime-OSS_ocpp
            -Dsonar.organization=computime-oss
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=custom_components/ocpp
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
