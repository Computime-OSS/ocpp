# Home Assistant + local OCPP integration (development)
#
# Uses ./ocpp/custom_components/ocpp mounted into the container so edits on the
# host load after HA restart (Settings → System → Restart, or container restart).
#
# No dbus mount (works on Docker Desktop for Windows). No nginx/API.
#
# Usage (repo root):
#   copy .env.example to .env and set TZ / HA_CONFIG if needed
#   docker compose -f docker-compose-dev.yml up -d
#
# UI: http://127.0.0.1:${HA_HTTP_PORT:-8123} (or your LAN IP — see note below)
# OCPP: ws://<LAN-IP>:9000 — integration host 0.0.0.0, port 9000
#
# NOTE: If Cursor/VS Code or another app binds 127.0.0.1:8123, "localhost:8123" will NOT
# reach Home Assistant. Use your LAN IP, or set HA_HTTP_PORT=8124 in .env and open :8124.
#
# --- Connectivity (Docker Desktop on Windows) ---
# - Host networking is NOT available like on Linux; ports must be published below.
# - 0.0.0.0 binds all IPv4 interfaces so other devices on your LAN can use http://<PC-LAN-IP>:8123
#   and chargers can use ws://<PC-LAN-IP>:9000 (allow Docker Desktop through Windows Firewall if prompted).
# - Outbound: container traffic uses the bridge NAT to your LAN and internet by default.
# - To reach apps on the Windows host from inside HA, use host name: host.docker.internal

name: ha-ocpp-dev

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant-ocpp-dev
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${HA_HTTP_PORT:-8123}:8123/tcp"
      - "0.0.0.0:${HA_OCPP_PORT:-9000}:9000/tcp"
      - "0.0.0.0:80:80/tcp"
    volumes:
      - ${HA_CONFIG:-./homeassistant/config}:/config
      - ./ocpp/custom_components/ocpp:/config/custom_components/ocpp
    networks:
      - ha_dev

networks:
  ha_dev:
    driver: bridge
